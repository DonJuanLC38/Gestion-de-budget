<script>
  // Chargement de Chart.js avec plusieurs sources de secours.
  // Si aucune ne marche (pas d'internet), l'app fonctionne quand même sans le graphique.
  (function loadChart() {
    var sources = [
      'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js',
      'https://unpkg.com/chart.js@4.4.0/dist/chart.umd.min.js'
    ];
    var idx = 0;
    function tryNext() {
      if (idx >= sources.length) return;
      var s = document.createElement('script');
      s.src = sources[idx++];
      s.onload = function() {
        if (typeof renderChart === 'function') {
          var card = document.querySelector('.chart-card');
          if (card && card.dataset.fallback) {
            card.removeAttribute('data-fallback');
            card.innerHTML = '<button class="chart-toggle" id="chart-toggle" onclick="toggleChartView()">📊 Détail</button><div class="chart-inner"><div class="chart-wrap"><canvas id="donut-chart"></canvas></div></div>';
          }
          renderChart();
        }
      };
      s.onerror = tryNext;
      document.head.appendChild(s);
    }
    tryNext();
  })();
</script>
<style>

<body>

<button class="sound-toggle" id="sound-toggle" onclick="toggleSound()" aria-label="Sons">🔊</button>

<div class="header-row" style="padding-right: 50px;">
  <h2>💰 Budget Mensuel</h2>
</div>

<div class="month-bar">
  <button class="month-display month-display-btn" id="month-display" onclick="openMonthPicker()"></button>
  <button class="reset-btn" onclick="openMonthPicker()" style="padding: 8px 12px;" title="Sélectionner un mois">📅</button>
  <button class="reset-btn" onclick="openColorPicker()" style="padding: 8px 12px;" title="Couleurs">🎨</button>
  <button class="reset-btn" onclick="resetMonth()">↻</button>
</div>

<div class="top-card">
  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
    <div style="flex: 1;">
      <div class="muted">Budget total</div>
      <div class="big" id="total-budget">950 €</div>
    </div>
    <button class="menu-btn" onclick="openBudgetEdit('salary')" aria-label="Modifier salaire">⋮</button>
  </div>

<script>
const STORAGE_KEY = 'budget_mensuel_v12';
const CONFIG_KEY = 'budget_config_v10';
const PLAISIR_TYPES = [
  { key: 'sortie', label: 'Sortie', shade: 0 },
  { key: 'shopping', label: 'Shopping', shade: 1 },
  { key: 'loisirs', label: 'Loisirs', shade: 2 },
  { key: 'cadeau', label: 'Cadeau', shade: 3 },
  { key: 'voyage', label: 'Voyage', shade: 4 },

];
const DEFAULT_CONFIG = { salary: 0, plaisirBudget: 0, aboBudget: 0, investBudget: 0, essenceBudget: 0 };

// Palette de 8 couleurs (comme Notion) × 3 styles (Standard / Néon / Pastel)
const COLOR_HUES = [

const COLOR_STYLES = ['standard', 'neon', 'pastel'];

// Table complète : hue × style → { main, light, text, glow }
const COLOR_PALETTES = {
  gris: {
    standard: { main: '#8F8F8F', light: '#C0C0C0', text: '#C0C0C0', glow: false },

  },
  rouge: {

    neon:     { main: '#FF3355', light: '#FF7788', text: '#FF3355', glow: true },
    pastel:   { main: '#F0BFBE', light: '#F7D5D5', text: '#F2C4C4', glow: false }
  },
  orange: {
    standard: { main: '#DA9848', light: '#F0C48A', text: '#F0C48A', glow: false },

  },
  jaune: {

    neon:     { main: '#FFEE00', light: '#FFF566', text: '#FFEE00', glow: true },
    pastel:   { main: '#EEE0B0', light: '#F5EACC', text: '#EFE3B8', glow: false }
  },
  vert: {

    neon:     { main: '#00FF88', light: '#66FFB0', text: '#00FF88', glow: true },
    pastel:   { main: '#A8D8C0', light: '#C8E8D5', text: '#B8E0CB', glow: false }
  },
  bleu: {
    standard: { main: '#4E9BE3', light: '#93CEF5', text: '#B5D4F4', glow: false },
    neon:     { main: '#00E5FF', light: '#66F2FF', text: '#00E5FF', glow: true },
    pastel:   { main: '#B8D8F0', light: '#D0E4F5', text: '#C8DEF3', glow: false }
  },
  violet: {
    standard: { main: '#8A80E0', light: '#B8B0F0', text: '#C4BFF0', glow: false },
    neon:     { main: '#B026FF', light: '#D470FF', text: '#B026FF', glow: true },
    pastel:   { main: '#C8C0EC', light: '#DDD5F2', text: '#D5CDF0', glow: false }
  },
  rose: {
    standard: { main: '#DC6690', light: '#F1B2CC', text: '#F4C0D1', glow: false },
    neon:     { main: '#FF3EA5', light: '#FF7BC0', text: '#FF3EA5', glow: true },
    pastel:   { main: '#F4C0D1', light: '#FADAE3', text: '#F8D0DC', glow: false }
  }
};

// Config par défaut : chaque catégorie a sa hue et son style
const DEFAULT_CATEGORY_STYLES = {
  essentiels: { hue: 'vert', style: 'standard' },
  plaisir:    { hue: 'rose', style: 'standard' },
  invest:     { hue: 'bleu', style: 'standard' },
  extras:     { hue: 'violet', style: 'standard' }
};

function getColorFor(category) {
  const cfg = (config.categoryStyles && config.categoryStyles[category]) || DEFAULT_CATEGORY_STYLES[category];
  // Support ancien format (juste 'standard' au lieu d'objet)
  const hue = (typeof cfg === 'object') ? cfg.hue : DEFAULT_CATEGORY_STYLES[category].hue;
  const style = (typeof cfg === 'object') ? cfg.style : cfg;
  return (COLOR_PALETTES[hue] && COLOR_PALETTES[hue][style]) || COLOR_PALETTES[DEFAULT_CATEGORY_STYLES[category].hue].standard;
}

function applyCategoryColors() {
  const root = document.documentElement;
  ['essentiels', 'plaisir', 'invest', 'extras'].forEach(cat => {
    const c = getColorFor(cat);
    root.style.setProperty(`--color-${cat}`, c.main);
    root.style.setProperty(`--color-${cat}-light`, c.light);
    root.style.setProperty(`--color-${cat}-text`, c.text);
    root.style.setProperty(`--glow-${cat}`, c.glow ? `0 0 12px ${c.main}` : 'none');
  });
}
let config = loadConfig();

function loadConfig() {
  try {
    const saved = localStorage.getItem(CONFIG_KEY);
    if (saved) return Object.assign({}, DEFAULT_CONFIG, JSON.parse(saved));
  } catch (e) {}
  return Object.assign({}, DEFAULT_CONFIG);
}
function saveConfig() {
  try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) {}
}
const monthNames = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];

const defaultMonthState = () => {
  const defaultAbos = (config.defaultLists && Array.isArray(config.defaultLists.abos))
    ? config.defaultLists.abos.map(it => ({ name: it.name, amount: it.amount, paid: false }))
    : [];
  const defaultInvests = (config.defaultLists && Array.isArray(config.defaultLists.invests))
    ? config.defaultLists.invests.map(it => ({ name: it.name, amount: it.amount, done: 0 }))
    : [];
  return {
    abos: defaultAbos,
    invests: defaultInvests,
    plaisirs: [],
    extras: [],
    essencePaid: false,
    essenceAmount: 0,
    budgets: {
      salary: config.salary,
      aboBudget: config.aboBudget,
      essenceBudget: config.essenceBudget,
      plaisirBudget: config.plaisirBudget,
      investBudget: config.investBudget
    }
  };
};

let allData = loadAll();
const now = new Date();
let currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
let soundOn = localStorage.getItem('budget_sound') !== 'off';

function loadAll() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      for (const k in data) {
        if (!data[k].extras) data[k].extras = [];
        // Migration : ajouter budgets si absent (ancien format)
        if (!data[k].budgets) {
          data[k].budgets = {
            salary: config.salary,
            aboBudget: config.aboBudget,
            essenceBudget: config.essenceBudget,
            plaisirBudget: config.plaisirBudget,
            investBudget: config.investBudget
          };
        }
      }
      return data;
    }
  } catch (e) {}
  return {};
}

function saveAll() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(allData)); } catch (e) {}
}

function getState() {
  if (!allData[currentMonthKey]) allData[currentMonthKey] = defaultMonthState();
  const s = allData[currentMonthKey];
  const def = defaultMonthState();
  // Réparation : si les listes sont absentes ou vides, on remet les valeurs par défaut
  if (!Array.isArray(s.abos)) s.abos = [];
  if (!Array.isArray(s.invests)) s.invests = [];
  if (!Array.isArray(s.plaisirs)) s.plaisirs = [];
  if (!Array.isArray(s.extras)) s.extras = [];
  if (typeof s.essenceAmount !== 'number') s.essenceAmount = 0;
  if (typeof s.essencePaid !== 'boolean') s.essencePaid = false;
  // Migration invests : ancien format avec "paid" → nouveau format avec "done"
  s.invests.forEach(it => {
    if (typeof it.done !== 'number') {
      it.done = it.paid === true ? it.amount : 0;
      delete it.paid;
    }
  });
  if (!s.budgets) {
    s.budgets = {
      salary: config.salary,
      aboBudget: config.aboBudget,
      essenceBudget: config.essenceBudget,
      plaisirBudget: config.plaisirBudget,
      investBudget: config.investBudget
    };
  }
  return s;
}

function getPreviousMonthKey() {
  const [y, m] = currentMonthKey.split('-').map(Number);
  const prevDate = new Date(y, m - 2, 1);
  return `${prevDate.getFullYear()}-${String(prevDate.getMonth() + 1).padStart(2, '0')}`;
}

function hasMonthContent(monthKey) {
  const s = allData[monthKey];
  if (!s) return false;
  // Un mois a du contenu s'il a au moins un abo, invest, plaisir, extra, ou de l'essence
  const hasAbos = Array.isArray(s.abos) && s.abos.length > 0;
  const hasInvests = Array.isArray(s.invests) && s.invests.length > 0;
  const hasPlaisirs = Array.isArray(s.plaisirs) && s.plaisirs.length > 0;
  const hasExtras = Array.isArray(s.extras) && s.extras.length > 0;
  const hasEssence = (s.essenceAmount || 0) > 0;
  return hasAbos || hasInvests || hasPlaisirs || hasExtras || hasEssence;
}

function getCurrentRealMonthKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}`;
}

function changeMonth(delta) {
  const [y, m] = currentMonthKey.split('-').map(Number);
  const newDate = new Date(y, m - 1 + delta, 1);
  const newKey = `${newDate.getFullYear()}-${String(newDate.getMonth() + 1).padStart(2, '0')}`;
  const currentReal = getCurrentRealMonthKey();

  // Vers le passé : autorisé seulement si le mois cible a du contenu
  if (delta < 0 && newKey < currentReal && !hasMonthContent(newKey)) {
    showToast('Aucun mois précédent avec des données', 'warning');
    playSound('uncheck');
    return;
  }
  // Vers le futur : autorisé seulement si le mois cible a du contenu OU c'est un mois futur "vide" (permet planification)
  // Mais on limite : pas plus de 1 mois dans le futur si vide
  if (delta > 0 && newKey > currentReal && !hasMonthContent(newKey)) {
    // Vérifier si le mois cible est immédiatement après le dernier mois avec contenu
    // Simple règle : on autorise 1 mois "vide" au-delà du plus récent avec contenu
    const monthsWithContent = Object.keys(allData).filter(k => hasMonthContent(k)).sort();
    const latestWithContent = monthsWithContent.length ? monthsWithContent[monthsWithContent.length - 1] : currentReal;
    const [ly, lm] = latestWithContent.split('-').map(Number);
    const oneAfter = new Date(ly, lm - 1 + 1, 1);
    const oneAfterKey = `${oneAfter.getFullYear()}-${String(oneAfter.getMonth() + 1).padStart(2, '0')}`;
    if (newKey > oneAfterKey) {
      showToast('Termine ton mois avant de passer au suivant', 'warning');
      playSound('uncheck');
      return;
    }
  }

  currentMonthKey = newKey;
  renderAll();
  playSound('tick');
}

function resetMonth() {
  if (confirm(`Réinitialiser ${getMonthLabel()} ?`)) {
    allData[currentMonthKey] = defaultMonthState();
    saveAll();
    renderAll();
    showToast('Mois réinitialisé', 'warning');
    playSound('reset');
  }
}

function getMonthLabel() {
  const [y, m] = currentMonthKey.split('-').map(Number);
  return `${monthNames[m - 1]} ${y}`;
}

let audioCtx;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}

function playSound(type) {
  if (!soundOn) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  const sounds = {
    check: { freq: 880, dur: 0.08, type: 'sine', gain: 0.15 },
    uncheck: { freq: 440, dur: 0.06, type: 'sine', gain: 0.1 },
    add: { freq: 660, dur: 0.1, type: 'triangle', gain: 0.15 },
    money: { freq: 780, dur: 0.12, type: 'triangle', gain: 0.18 },
    delete: { freq: 220, dur: 0.08, type: 'square', gain: 0.08 },
    tick: { freq: 1000, dur: 0.04, type: 'sine', gain: 0.08 },
    reset: { freq: 330, dur: 0.15, type: 'triangle', gain: 0.12 }
  };
  const s = sounds[type] || sounds.tick;
  o.type = s.type;
  o.frequency.value = s.freq;
  g.gain.setValueAtTime(s.gain, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + s.dur);
  o.start();
  o.stop(ctx.currentTime + s.dur);
  if (type === 'check' || type === 'money') {
    const second = type === 'money' ? 1100 : 1320;
    setTimeout(() => {
      const o2 = ctx.createOscillator();
      const g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type = 'sine'; o2.frequency.value = second;
      g2.gain.setValueAtTime(0.12, ctx.currentTime);
      g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
      o2.start(); o2.stop(ctx.currentTime + 0.08);
    }, 60);
  }
}

function toggleSound() {
  soundOn = !soundOn;
  localStorage.setItem('budget_sound', soundOn ? 'on' : 'off');
  document.getElementById('sound-toggle').textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) playSound('check');
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => t.classList.remove('show'), 2200);
}

function renderList(items, containerId, key) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  if (!items || items.length === 0) {
    container.innerHTML = '<div class="empty">Aucune ligne. Tape ⋮ pour en ajouter ✨</div>';
    return;
  }
  items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'row' + (item.paid ? ' paid' : '');
    row.innerHTML = `
      <label>
        <input type="checkbox" ${item.paid ? 'checked' : ''} onchange="togglePaid('${key}', ${i}, this.checked, this)" />
        <span>${escapeHtml(item.name)}</span>
      </label>
      <span class="amount">${item.amount} €</span>
    `;
    container.appendChild(row);
  });
}

function getInvestTarget(item) {
  // Palier effectif d'une ligne d'invest = montant cible + extras affectés à cette ligne
  if (!item || !item.name) return item ? item.amount : 0;
  const state = getState();
  const extrasForLine = state.extras.filter(e => e.target === item.name).reduce((s, e) => s + e.amount, 0);
  return (item.amount || 0) + extrasForLine;
}

function renderInvestList() {
  const state = getState();
  const container = document.getElementById('invest-list');
  container.innerHTML = '';
  if (!state.invests || state.invests.length === 0) {
    container.innerHTML = '<div class="empty">Aucun investissement. Tape ⋮ pour en ajouter 💸</div>';
    return;
  }
  state.invests.forEach((item, i) => {
    const done = item.done || 0;
    const target = getInvestTarget(item);
    const isDone = done >= target && target > 0;
    const row = document.createElement('div');
    row.className = 'invest-row' + (isDone ? ' done' : '');
    row.innerHTML = `
      <span class="invest-name">${escapeHtml(item.name)}</span>
      <div class="invest-input-wrap">
        <input type="number" value="${done}" min="0" step="5" inputmode="numeric"
               oninput="updateInvestDone(${i}, this.value)" />
        <span class="invest-target">/ ${target} €</span>
      </div>
    `;
    container.appendChild(row);
  });
}

function updateInvestDone(i, value) {
  const state = getState();
  let val = parseFloat(value) || 0;
  if (val < 0) val = 0;
  const target = getInvestTarget(state.invests[i]);
  const wasDone = (state.invests[i].done || 0) >= target;
  state.invests[i].done = Math.round(val);
  const isDone = state.invests[i].done >= target && target > 0;
  saveAll();
  // Son quand on atteint le palier
  if (isDone && !wasDone) playSound('check');
  // Mise à jour visuelle de la ligne sans tout re-render (garde le focus dans le champ)
  const rows = document.querySelectorAll('#invest-list .invest-row');
  if (rows[i]) rows[i].classList.toggle('done', isDone);
  renderChart();
}

function togglePaid(key, i, checked, el) {
  const state = getState();
  state[key][i].paid = checked;
  saveAll();
  playSound(checked ? 'check' : 'uncheck');
  const row = el.closest('.row');
  if (row) {
    // Mise à jour visuelle immédiate : contour blanc si coché
    row.classList.toggle('paid', checked);
    row.classList.add('checkmark-pop');
    setTimeout(() => row.classList.remove('checkmark-pop'), 300);
  }
  renderChart();
}

function formatShortDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const shortMonths = ['janv', 'févr', 'mars', 'avr', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];
    return d.getDate() + ' ' + shortMonths[d.getMonth()];
  } catch (e) { return ''; }
}

function todayISO() {
  const d = new Date();
  return d.toISOString().split('T')[0];
}

function getPlaisirTypeMeta(typeKey) {
  const found = PLAISIR_TYPES.find(t => t.key === typeKey);
  return found || PLAISIR_TYPES[5]; // autre par défaut
}

function renderPlaisirs() {
  const state = getState();
  const list = document.getElementById('plaisir-list');
  const seeAllBtn = document.getElementById('plaisir-see-all');
  const countEl = document.getElementById('plaisir-count');
  list.innerHTML = '';
  if (state.plaisirs.length === 0) {
    list.innerHTML = '<div class="empty">Aucune dépense plaisir 🌟</div>';
    if (seeAllBtn) seeAllBtn.style.display = 'none';
    return;
  }
  // Afficher seulement les 3 dernières ajoutées (les plus récentes = fin du tableau)
  const total = state.plaisirs.length;
  const start = Math.max(0, total - 3);
  for (let i = total - 1; i >= start; i--) {
    const p = state.plaisirs[i];
    const typeMeta = getPlaisirTypeMeta(p.type);
    const dateStr = formatShortDate(p.date);
    const row = document.createElement('div');
    row.className = 'plaisir-row';
    row.innerHTML = `
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 600; word-break: break-word;">${escapeHtml(p.name)}</div>
        <div style="font-size: 11px; color: #b8b8b6; margin-top: 2px;">
          <span>${typeMeta.label}</span>${dateStr ? ' · <span>' + dateStr + '</span>' : ''}
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="amount">${p.amount} €</span>
        <button class="del" onclick="removePlaisir(${i})" aria-label="Supprimer">✕</button>
      </div>
    `;
    list.appendChild(row);
  }
  if (total > 3) {
    if (countEl) countEl.textContent = total;
    if (seeAllBtn) seeAllBtn.style.display = 'block';
  } else {
    if (seeAllBtn) seeAllBtn.style.display = 'none';
  }
}

function renderExtras() {
  const state = getState();
  const list = document.getElementById('extras-list');
  const summary = document.getElementById('extras-summary');
  if (!list) return;
  list.innerHTML = '';

  if (!Array.isArray(state.extras) || state.extras.length === 0) {
    list.innerHTML = '<div class="empty extras">Aucun extra ce mois 💜</div>';
    if (summary) summary.style.display = 'none';
    return;
  }

  state.extras.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'extra-row';
    const targetDisplay = e.target ? `→<span class="pill">${escapeHtml(e.target)}</span>` : '<span style="opacity:0.6">→ non affecté</span>';
    row.innerHTML = `
      <div class="extra-info">
        <span class="extra-name">${escapeHtml(e.name)}</span>
        <span class="extra-target">${targetDisplay}</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <span class="amount" style="color: #c4bff0;">+${e.amount} €</span>
        <button class="del" onclick="removeExtra(${i})" aria-label="Supprimer">✕</button>
      </div>
    `;
    list.appendChild(row);
  });

  const byTarget = {};
  state.extras.forEach(e => {
    const k = e.target || 'Non affecté';
    byTarget[k] = (byTarget[k] || 0) + e.amount;
  });
  const total = state.extras.reduce((s, e) => s + e.amount, 0);
  const parts = Object.entries(byTarget).map(([k, v]) => `${k}: ${v}€`).join(' · ');
  summary.textContent = `Répartition: ${parts}`;
  summary.style.display = 'block';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function addPlaisir() {
  const state = getState();
  const name = document.getElementById('plaisir-name').value.trim();
  const amount = parseFloat(document.getElementById('plaisir-amount').value);
  const typeSel = document.getElementById('plaisir-type');
  const type = typeSel ? typeSel.value || 'autre' : 'autre';
  if (name && amount > 0) {
    state.plaisirs.push({
      name,
      amount: Math.round(amount),
      type,
      date: todayISO()
    });
    document.getElementById('plaisir-name').value = '';
    document.getElementById('plaisir-amount').value = '';
    if (typeSel) typeSel.value = '';
    saveAll();
    playSound('add');
    renderPlaisirs();
    renderChart();
    const total = state.plaisirs.reduce((s, p) => s + p.amount, 0);
    const plaisirExtrasSum = state.extras.filter(e => e.target === 'Plaisir').reduce((s, e) => s + e.amount, 0);
    const plaisirBudgetEff = state.budgets.plaisirBudget + plaisirExtrasSum;
    if (total > plaisirBudgetEff) showToast('⚠️ Budget plaisir dépassé !', 'danger');
  } else if (!amount || amount <= 0) {
    showToast('Entre un montant', 'danger');
  } else {
    showToast('Entre un nom', 'danger');
  }
}

function removePlaisir(i) {
  const state = getState();
  state.plaisirs.splice(i, 1);
  saveAll();
  playSound('delete');
  renderPlaisirs();
  renderChart();
}

function addExtra() {
  const state = getState();
  const nameEl = document.getElementById('extra-name');
  const amountEl = document.getElementById('extra-amount');
  const targetEl = document.getElementById('extra-target');
  let name = nameEl.value.trim();
  const amount = parseFloat(amountEl.value);
  const target = targetEl.value;

  // Le montant est obligatoire ; le nom est optionnel
  if (!amount || amount <= 0) {
    showToast('Entre un montant pour l\'extra', 'danger');
    amountEl.focus();
    return;
  }
  if (!name) name = 'Extra';

  state.extras.push({ name, amount: Math.round(amount), target });
  nameEl.value = '';
  amountEl.value = '';
  targetEl.value = '';
  saveAll();
  playSound('money');
  renderExtras();
  renderInvestList();
  renderChart();
  showToast(`+${Math.round(amount)} € ajoutés au budget`, 'purple');
}

function removeExtra(i) {
  const state = getState();
  state.extras.splice(i, 1);
  saveAll();
  playSound('delete');
  renderExtras();
  renderInvestList();
  renderChart();
}

document.getElementById('plaisir-amount').addEventListener('keydown', e => { if (e.key === 'Enter') addPlaisir(); });
document.getElementById('plaisir-name').addEventListener('keydown', e => { if (e.key === 'Enter') addPlaisir(); });
document.getElementById('extra-amount').addEventListener('keydown', e => { if (e.key === 'Enter') addExtra(); });
document.getElementById('extra-name').addEventListener('keydown', e => { if (e.key === 'Enter') addExtra(); });

document.getElementById('essence-check').addEventListener('change', e => {
  const state = getState();
  state.essencePaid = e.target.checked;
  if (e.target.checked && state.essenceAmount === 0) {
    state.essenceAmount = state.budgets.essenceBudget || 0;
    document.getElementById('essence-amount').value = state.essenceAmount;
  }
  if (!e.target.checked) {
    state.essenceAmount = 0;
    document.getElementById('essence-amount').value = 0;
  }
  saveAll();
  playSound(e.target.checked ? 'check' : 'uncheck');
  updateEssenceVisual();
  renderChart();
});

document.getElementById('essence-amount').addEventListener('input', e => {
  const state = getState();
  let val = parseFloat(e.target.value) || 0;
  if (val < 0) val = 0;
  const budget = state.budgets.essenceBudget || 0;
  const wasDone = (state.essenceAmount || 0) >= budget;
  state.essenceAmount = Math.round(val);
  state.essencePaid = val > 0;
  document.getElementById('essence-check').checked = state.essencePaid;
  const isDone = state.essenceAmount >= budget && budget > 0;
  if (isDone && !wasDone) playSound('check');
  updateEssenceVisual();
  saveAll();
  renderChart();
});

function updateEssenceVisual() {
  const state = getState();
  const budget = state.budgets.essenceBudget || 0;
  const isDone = (state.essenceAmount || 0) >= budget && budget > 0;
  const row = document.querySelector('.essence-row');
  if (row) row.classList.toggle('done', isDone);
}

let chart;
function renderChart() {
  try {
    _renderChartImpl();
  } catch (e) {
    console.warn('Chart non disponible:', e);
  }
}
function _renderChartImpl() {
  const state = getState();
  const aboPaidRaw = state.abos.filter(a => a.paid).reduce((s, a) => s + a.amount, 0);
  const investPaid = state.invests.reduce((s, a) => s + (a.done || 0), 0);
  const plaisirSum = state.plaisirs.reduce((s, p) => s + p.amount, 0);
  const extrasSum = state.extras.reduce((s, e) => s + e.amount, 0);
  const essence = state.essenceAmount;

  // Calcul des extras par cible (pour ajuster les budgets dynamiquement)
  const extrasByTarget = {};
  state.extras.forEach(e => {
    const t = e.target || '';
    extrasByTarget[t] = (extrasByTarget[t] || 0) + e.amount;
  });
  const plaisirExtras = extrasByTarget['Plaisir'] || 0;
  const matelasExtras = extrasByTarget['Matelas de secours'] || 0;
  const tradeExtras = extrasByTarget['Trade Republic'] || 0;

  // Budgets effectifs (budget de base + extras affectés à cette catégorie)
  const plaisirBudgetEff = state.budgets.plaisirBudget + plaisirExtras;
  const investBudgetEff = state.budgets.investBudget + matelasExtras + tradeExtras;

  // L'essence est comptée DANS les besoins essentiels
  const aboPaid = aboPaidRaw + essence;
  const totalSpent = aboPaid + investPaid + plaisirSum;
  const totalBudget = state.budgets.salary + extrasSum;
  const remaining = Math.max(0, totalBudget - totalSpent);
  const percent = Math.min(100, Math.round((totalSpent / totalBudget) * 100));

  document.getElementById('total-budget').textContent = totalBudget + ' €';
  const detail = document.getElementById('budget-detail');
  if (extrasSum > 0) {
    detail.textContent = `${state.budgets.salary} € + ${extrasSum} € d'extras 💜`;
  } else {
    detail.textContent = '';
  }

  // Mise à jour des budgets affichés dans les titres (avec extras affectés)
  document.getElementById('plaisir-budget').textContent = plaisirBudgetEff;
  document.getElementById('abo-budget').textContent = state.budgets.aboBudget;
  document.getElementById('invest-budget').textContent = investBudgetEff;
  const essBudget = document.getElementById('essence-budget-display');
  if (essBudget) essBudget.textContent = state.budgets.essenceBudget;

  // Pourcentages : part RÉELLE de chaque catégorie dans les dépenses effectives
  // (si tu dépasses en plaisir, son % monte pour refléter la réalité)
  const realTotal = totalSpent || 1;
  const aboRealPct = totalSpent > 0 ? Math.round((aboPaid / realTotal) * 100) : Math.round((state.budgets.aboBudget / (state.budgets.salary || 1)) * 100);
  const plaisirRealPct = totalSpent > 0 ? Math.round((plaisirSum / realTotal) * 100) : Math.round((plaisirBudgetEff / (state.budgets.salary || 1)) * 100);
  const investRealPct = totalSpent > 0 ? Math.round((investPaid / realTotal) * 100) : Math.round((investBudgetEff / (state.budgets.salary || 1)) * 100);
  document.getElementById('abo-pct').textContent = aboRealPct + '%';
  document.getElementById('plaisir-pct').textContent = plaisirRealPct + '%';
  document.getElementById('invest-pct').textContent = investRealPct + '%';

  document.getElementById('abo-total').textContent = Math.round(aboPaid);
  document.getElementById('invest-total').textContent = Math.round(investPaid);
  document.getElementById('plaisir-total').textContent = Math.round(plaisirSum);
  document.getElementById('extras-total').textContent = Math.round(extrasSum);
  document.getElementById('spent-amount').textContent = Math.round(totalSpent) + ' €';
  const rem = totalBudget - totalSpent;
  const remEl = document.getElementById('remaining-amount');
  remEl.textContent = Math.round(rem) + ' €';
  remEl.style.color = rem < 0 ? '#f0999a' : '#6dd4a9';

  document.getElementById('progress-fill').style.width = percent + '%';
  document.getElementById('percent-stat').textContent = percent + '% du budget utilisé';

  const prevState = allData[getPreviousMonthKey()];
  const badge = document.getElementById('comparison-badge');
  if (prevState) {
    const prevTotal = prevState.abos.filter(a => a.paid).reduce((s, a) => s + a.amount, 0)
      + prevState.invests.reduce((s, a) => s + (a.done || 0), 0)
      + prevState.plaisirs.reduce((s, p) => s + p.amount, 0)
      + (prevState.essenceAmount || 0);
    const diff = totalSpent - prevTotal;
    if (Math.abs(diff) < 1) {
      badge.textContent = '= mois dernier';
      badge.className = 'comparison same';
    } else if (diff > 0) {
      badge.textContent = `↑ +${Math.round(diff)} € vs mois -1`;
      badge.className = 'comparison up';
    } else {
      badge.textContent = `↓ ${Math.round(diff)} € vs mois -1`;
      badge.className = 'comparison down';
    }
  } else {
    badge.textContent = 'Pas de mois -1';
    badge.className = 'comparison same';
  }

  // === Calcul données selon la vue ===
  // Fonction helper : génère 6 nuances d'une couleur (de foncée à claire)
  function makeShades(hexColor) {
    // Convertit hex vers RGB
    const h = hexColor.replace('#', '');
    const r = parseInt(h.substr(0, 2), 16);
    const g = parseInt(h.substr(2, 2), 16);
    const b = parseInt(h.substr(4, 2), 16);
    const shades = [];
    for (let i = 0; i < 6; i++) {
      // Mélange progressif avec blanc (plus l'index augmente, plus c'est clair)
      const factor = i * 0.15;
      const nr = Math.min(255, Math.round(r + (255 - r) * factor));
      const ng = Math.min(255, Math.round(g + (255 - g) * factor));
      const nb = Math.min(255, Math.round(b + (255 - b) * factor));
      shades.push('#' + [nr, ng, nb].map(v => v.toString(16).padStart(2, '0')).join(''));
    }
    return shades;
  }

  const colEssentiels = getColorFor('essentiels').main;
  const colPlaisir = getColorFor('plaisir').main;
  const colInvest = getColorFor('invest').main;
  const shadesEssentiels = makeShades(colEssentiels);
  const shadesPlaisir = makeShades(colPlaisir);
  const shadesInvest = makeShades(colInvest);

  let chartLabels, chartData, chartColors;
  const remainingForChart = Math.max(0, totalBudget - totalSpent);

  if (chartView === 'detailed') {
    chartLabels = [];
    chartData = [];
    chartColors = [];
    // Essentiels : abos cochés (chacun sa nuance) + essence
    let sIdx = 0;
    state.abos.forEach(a => {
      if (a.paid && a.amount > 0) {
        chartLabels.push(a.name);
        chartData.push(a.amount);
        chartColors.push(shadesEssentiels[sIdx % shadesEssentiels.length]);
        sIdx++;
      }
    });
    if (essence > 0) {
      chartLabels.push('Essence');
      chartData.push(essence);
      chartColors.push(shadesEssentiels[sIdx % shadesEssentiels.length]);
    }
    // Plaisir : par sous-type (nuances de rose)
    const plaisirByType = {};
    state.plaisirs.forEach(p => {
      const k = p.type || 'autre';
      plaisirByType[k] = (plaisirByType[k] || 0) + p.amount;
    });
    PLAISIR_TYPES.forEach(t => {
      if (plaisirByType[t.key] > 0) {
        chartLabels.push(t.label);
        chartData.push(plaisirByType[t.key]);
        chartColors.push(shadesPlaisir[t.shade % shadesPlaisir.length]);
      }
    });
    // Investissement : chaque ligne avec sa nuance
    let iIdx = 0;
    state.invests.forEach(inv => {
      if ((inv.done || 0) > 0) {
        chartLabels.push(inv.name);
        chartData.push(inv.done);
        chartColors.push(shadesInvest[iIdx % shadesInvest.length]);
        iIdx++;
      }
    });
    // Reste
    if (remainingForChart > 0) {
      chartLabels.push('Reste');
      chartData.push(remainingForChart);
      chartColors.push('#555');
    }
    // Cas où rien : mettre au moins un point
    if (chartData.length === 0) {
      chartLabels = ['Rien encore'];
      chartData = [1];
      chartColors = ['#333'];
    }
  } else {
    // Vue globale : 4 tranches
    chartLabels = ['Essentiels', 'Plaisir', 'Investis.', 'Reste'];
    chartData = [aboPaid, plaisirSum, investPaid, remainingForChart];
    chartColors = [colEssentiels, colPlaisir, colInvest, '#555'];
  }

  const data = chartData;
  const spentForCenter = totalSpent;

  // Si Chart.js n'est pas chargé (pas d'internet), on s'arrête là.
  // Tout le reste de l'app (cases, totaux) fonctionne quand même.
  if (typeof Chart === 'undefined') {
    const chartCard = document.querySelector('.chart-card');
    if (chartCard && !chartCard.dataset.fallback) {
      chartCard.dataset.fallback = '1';
      chartCard.innerHTML = '<div style="text-align:center; color:#888; font-size:13px; padding:20px;">📊 Le graphique s\'affichera<br>quand tu auras une connexion internet</div>';
    }
    return;
  }

  if (chart) {
    chart.data.labels = chartLabels;
    chart.data.datasets[0].data = data;
    chart.data.datasets[0].backgroundColor = chartColors;
    chart._centerSpent = spentForCenter;
    chart._centerBudget = totalBudget;
    chart.update('none');
  } else {
    const colors = chartColors;

    // Plugin: texte au centre + étiquettes avec flèches
    const centerAndLabelsPlugin = {
      id: 'centerAndLabels',
      afterDraw(c) {
        const { ctx, chartArea } = c;
        const cx = (chartArea.left + chartArea.right) / 2;
        const cy = (chartArea.top + chartArea.bottom) / 2;

        // Texte au centre : montant dépensé
        const spent = c._centerSpent || 0;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#999';
        ctx.font = '600 11px -apple-system, system-ui, sans-serif';
        ctx.fillText('Dépensé', cx, cy - 16);
        ctx.fillStyle = '#e9e9e7';
        ctx.font = '700 22px -apple-system, system-ui, sans-serif';
        ctx.fillText(Math.round(spent) + ' €', cx, cy + 6);
        ctx.fillStyle = '#777';
        ctx.font = '500 10px -apple-system, system-ui, sans-serif';
        ctx.fillText('/ ' + Math.round(c._centerBudget || 0) + ' €', cx, cy + 22);
        ctx.restore();

        // Étiquettes avec flèches sur chaque tranche
        const meta = c.getDatasetMeta(0);
        const dataset = c.data.datasets[0];
        const labels = c.data.labels;
        const total = dataset.data.reduce((s, v) => s + v, 0);
        if (total === 0) return;

        ctx.save();
        ctx.font = '600 10px -apple-system, system-ui, sans-serif';

        meta.data.forEach((arc, i) => {
          const value = dataset.data[i];
          if (value <= 0) return;
          const pct = value / total;
          if (pct < 0.04) return; // tranches trop petites = pas d'étiquette

          const angle = (arc.startAngle + arc.endAngle) / 2;
          const outerRadius = arc.outerRadius;
          const x1 = cx + Math.cos(angle) * outerRadius;
          const y1 = cy + Math.sin(angle) * outerRadius;
          const x2 = cx + Math.cos(angle) * (outerRadius + 10);
          const y2 = cy + Math.sin(angle) * (outerRadius + 10);
          const isRight = Math.cos(angle) >= 0;
          const x3 = x2 + (isRight ? 14 : -14);

          // Ligne du connecteur
          ctx.strokeStyle = colors[i];
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.lineTo(x3, y2);
          ctx.stroke();

          // Petit point au bout
          ctx.fillStyle = colors[i];
          ctx.beginPath();
          ctx.arc(x3, y2, 2, 0, Math.PI * 2);
          ctx.fill();

          // Texte (nom + montant)
          ctx.fillStyle = colors[i];
          ctx.textAlign = isRight ? 'left' : 'right';
          ctx.textBaseline = 'bottom';
          ctx.fillText(labels[i], x3 + (isRight ? 4 : -4), y2 - 1);
          ctx.fillStyle = '#e9e9e7';
          ctx.textBaseline = 'top';
          ctx.font = '700 11px -apple-system, system-ui, sans-serif';
          ctx.fillText(Math.round(value) + ' €', x3 + (isRight ? 4 : -4), y2 + 1);
          ctx.font = '600 10px -apple-system, system-ui, sans-serif';
        });
        ctx.restore();
      }
    };

    const ctxEl = document.getElementById('donut-chart').getContext('2d');
    chart = new Chart(ctxEl, {
      type: 'doughnut',
      data: {
        labels: chartLabels,
        datasets: [{
          data: data,
          backgroundColor: colors,
          borderWidth: 0,
          hoverOffset: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: true,
        cutout: '68%',
        layout: { padding: 50 },
        animation: { animateRotate: true, duration: 600 },
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#2a2a2a',
            titleColor: '#fff',
            bodyColor: '#e9e9e7',
            borderColor: '#3a3a3a',
            borderWidth: 1,
            padding: 10,
            callbacks: { label: c => c.label + ': ' + Math.round(c.parsed) + ' €' }
          }
        }
      },
      plugins: [centerAndLabelsPlugin]
    });
    chart._centerSpent = spentForCenter;
    chart._centerBudget = totalBudget;
    chart.update('none');
  }
}

// ============ SÉLECTEUR DE COULEURS PAR CATÉGORIE ============
function openColorPicker(activeCategory) {
  const categories = [
    { key: 'essentiels', label: '🏠 Besoins essentiels' },
    { key: 'plaisir', label: '🎉 Plaisir' },
    { key: 'invest', label: '💸 Investissement' },
    { key: 'extras', label: '💜 Extras' }
  ];
  const activeCat = activeCategory || 'essentiels';

  // Onglets catégories
  let body = '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px;">';
  categories.forEach(cat => {
    const isActive = cat.key === activeCat;
    const currentColor = getColorFor(cat.key);
    body += `<button
      onclick="openColorPicker('${cat.key}')"
      style="
        padding: 10px 8px;
        background: ${isActive ? currentColor.main : '#2B2B2B'};
        border: 1.5px solid ${isActive ? '#fff' : '#363636'};
        border-radius: 10px;
        color: ${isActive ? '#000' : '#EFEFEF'};
        font-family: inherit; font-size: 12px; font-weight: 600;
        cursor: pointer; transition: all 0.15s;
        display: flex; align-items: center; justify-content: center; gap: 5px;
      ">
      <span style="display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: ${currentColor.main}; ${currentColor.glow ? 'box-shadow: 0 0 6px ' + currentColor.main : ''}"></span>
      ${cat.label.split(' ')[0]} ${cat.label.split(' ').slice(1).join(' ')}
    </button>`;
  });
  body += '</div>';

  const activeCatLabel = categories.find(c => c.key === activeCat).label;
  body += `<div style="font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #EFEFEF;">${activeCatLabel}</div>`;

  const currentCfg = (config.categoryStyles && config.categoryStyles[activeCat]) || DEFAULT_CATEGORY_STYLES[activeCat];
  const currentHue = (typeof currentCfg === 'object') ? currentCfg.hue : DEFAULT_CATEGORY_STYLES[activeCat].hue;
  const currentStyle = (typeof currentCfg === 'object') ? currentCfg.style : 'standard';

  // Sélecteur de style (Standard / Néon / Pastel)
  body += '<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px;">';
  ['standard', 'neon', 'pastel'].forEach(style => {
    const selected = style === currentStyle;
    const label = style === 'standard' ? 'Standard' : style === 'neon' ? '✨ Néon' : 'Pastel';
    body += `<button
      onclick="pickColor('${activeCat}', '${currentHue}', '${style}')"
      style="
        padding: 8px 6px;
        background: ${selected ? '#4E9BE3' : '#2B2B2B'};
        border: 1px solid ${selected ? '#4E9BE3' : '#363636'};
        border-radius: 8px;
        color: ${selected ? '#fff' : '#B8B8B6'};
        font-family: inherit; font-size: 12px; font-weight: 600;
        cursor: pointer; transition: all 0.15s;
      ">${label}</button>`;
  });
  body += '</div>';

  // Grille des 8 couleurs
  body += '<div style="font-size: 12px; color: #8F8F8F; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; font-weight: 600;">Couleur</div>';
  body += '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;">';
  COLOR_HUES.forEach(hueDef => {
    const preview = COLOR_PALETTES[hueDef.key][currentStyle];
    const selected = hueDef.key === currentHue;
    const glow = preview.glow ? `box-shadow: 0 0 10px ${preview.main};` : '';
    body += `<button
      onclick="pickColor('${activeCat}', '${hueDef.key}', '${currentStyle}')"
      style="
        padding: 10px 4px;
        background: ${selected ? preview.main : '#2B2B2B'};
        border: 2px solid ${selected ? '#fff' : '#363636'};
        border-radius: 10px;
        color: ${selected ? '#000' : '#EFEFEF'};
        font-family: inherit; font-size: 10px; font-weight: 600;
        cursor: pointer; transition: all 0.15s;
        display: flex; flex-direction: column; align-items: center; gap: 5px;
        ${selected ? glow : ''}
      ">
      <span style="display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: ${preview.main}; ${preview.glow ? 'box-shadow: 0 0 8px ' + preview.main : ''}"></span>
      <span>${hueDef.label}</span>
    </button>`;
  });
  body += '</div>';

  openModal('🎨 Palette de couleurs', body, { type: 'colors', activeCat });
}

function pickColor(category, hue, style) {
  if (!config.categoryStyles) config.categoryStyles = { ...DEFAULT_CATEGORY_STYLES };
  config.categoryStyles[category] = { hue, style };
  saveConfig();
  applyCategoryColors();
  if (typeof chart !== 'undefined' && chart) {
    try { chart.destroy(); } catch (e) {}
    chart = null;
  }
  renderAll();
  // Réouvrir le picker sur la même catégorie pour montrer le nouveau choix
  openColorPicker(category);
}

// ============ SÉLECTEUR DE MOIS ============
function openMonthPicker() {
  const currentReal = getCurrentRealMonthKey();
  // Récupère tous les mois avec du contenu + le mois en cours
  const monthsSet = new Set();
  monthsSet.add(currentReal);
  Object.keys(allData).forEach(k => {
    if (hasMonthContent(k)) monthsSet.add(k);
  });
  const months = Array.from(monthsSet).sort().reverse(); // du plus récent au plus ancien

  let body = '<p class="muted" style="margin: 0 0 12px; text-transform: none; letter-spacing: 0; font-weight: normal;">Sélectionne un mois pour l\'afficher.</p>';
  body += '<div style="display: flex; flex-direction: column; gap: 8px;">';

  months.forEach(key => {
    const [y, m] = key.split('-').map(Number);
    const label = monthNames[m - 1] + ' ' + y;
    const isSelected = key === currentMonthKey;
    const isCurrent = key === currentReal;
    const s = allData[key];
    let subLabel = '';
    if (isCurrent && !hasMonthContent(key)) {
      subLabel = 'Mois en cours';
    } else if (s) {
      const totalSpent = (s.abos || []).filter(a => a.paid).reduce((sum, a) => sum + a.amount, 0)
        + (s.invests || []).reduce((sum, a) => sum + (a.done || 0), 0)
        + (s.plaisirs || []).reduce((sum, p) => sum + p.amount, 0)
        + (s.essenceAmount || 0);
      subLabel = totalSpent + ' € dépensés';
    }

    body += `<button
      onclick="pickMonth('${key}')"
      style="
        display: flex; justify-content: space-between; align-items: center;
        padding: 14px 16px;
        background: ${isSelected ? '#4E9BE3' : '#2B2B2B'};
        border: 1px solid ${isSelected ? '#4E9BE3' : '#363636'};
        border-radius: 10px; cursor: pointer;
        color: ${isSelected ? '#fff' : '#EFEFEF'};
        font-family: inherit; text-align: left;
        transition: all 0.15s;
      ">
      <div>
        <div style="font-size: 15px; font-weight: 600; text-transform: capitalize;">${label}</div>
        <div style="font-size: 11px; opacity: 0.7; margin-top: 2px;">${subLabel}</div>
      </div>
      ${isCurrent ? '<span style="font-size: 11px; padding: 3px 8px; background: rgba(255,255,255,0.15); border-radius: 6px; font-weight: 600;">AUJOURD\'HUI</span>' : ''}
    </button>`;
  });

  body += '</div>';
  openModal('📅 Choisir un mois', body, { type: 'month-picker' });
}

function pickMonth(key) {
  currentMonthKey = key;
  closeModal();
  renderAll();
  playSound('tick');
}

// Édition du budget global (salaire) et budgets de catégories
function openBudgetEdit(type) {
  const state = getState();
  if (type === 'salary') {
    const body = `
      <p class="muted" style="margin: 0 0 14px;">Modifie le salaire et les budgets pour <strong>${getMonthLabel()}</strong> uniquement. Les mois précédents ne changent pas.</p>
      <div class="modal-row"><span style="flex:1;">Salaire</span><input type="number" id="cfg-salary" value="${state.budgets.salary}" min="0" step="10" inputmode="numeric" /></div>
      <p class="muted" style="margin: 14px 0 8px; font-size: 12px;">Budgets par catégorie :</p>
      <div class="modal-row"><span style="flex:1;">🏠 Essentiels</span><input type="number" id="cfg-abo" value="${state.budgets.aboBudget}" min="0" step="5" inputmode="numeric" /></div>
      <div class="modal-row"><span style="flex:1;">⛽ Essence</span><input type="number" id="cfg-essence" value="${state.budgets.essenceBudget}" min="0" step="5" inputmode="numeric" /></div>
      <div class="modal-row"><span style="flex:1;">🎉 Plaisir</span><input type="number" id="cfg-plaisir" value="${state.budgets.plaisirBudget}" min="0" step="5" inputmode="numeric" /></div>
      <div class="modal-row"><span style="flex:1;">💸 Investis.</span><input type="number" id="cfg-invest" value="${state.budgets.investBudget}" min="0" step="5" inputmode="numeric" /></div>
      <label style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px; background: #2a2a2a; border-radius: 8px; cursor: pointer;">
        <input type="checkbox" id="cfg-apply-future" style="width: 18px; height: 18px; accent-color: #2383e2;" checked />
        <span style="font-size: 13px;">Appliquer aussi aux mois futurs (par défaut)</span>
      </label>
    `;
    openModal('Modifier le budget', body, { type: 'salary' });
  } else if (type === 'plaisir') {
    const body = `
      <p class="muted" style="margin: 0 0 14px;">Budget plaisir pour <strong>${getMonthLabel()}</strong>.</p>
      <div class="modal-row"><span style="flex:1;">🎉 Plaisir max</span><input type="number" id="cfg-plaisir" value="${state.budgets.plaisirBudget}" min="0" step="5" inputmode="numeric" /></div>
      <label style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px; background: #2a2a2a; border-radius: 8px; cursor: pointer;">
        <input type="checkbox" id="cfg-apply-future" style="width: 18px; height: 18px; accent-color: #2383e2;" checked />
        <span style="font-size: 13px;">Appliquer aussi aux mois futurs</span>
      </label>
    `;
    openModal('Modifier budget Plaisir', body, { type: 'plaisir' });
  }
}

// Édition d'une liste (abos ou invests)
function openListEdit(key, label) {
  const state = getState();
  const items = state[key];
  const isInvest = key === 'invests';
  let rows = items.map((it, i) => `
    <div class="modal-row" data-i="${i}">
      <input type="text" value="${escapeHtml(it.name)}" data-field="name" />
      <input type="number" value="${it.amount}" min="0" step="5" inputmode="numeric" data-field="amount" />
      <button class="del-item" onclick="modalDelItem(${i})" aria-label="Supprimer">✕</button>
    </div>
  `).join('');
  const helpText = isInvest
    ? "Modifie le nom ou l'objectif à atteindre. Le montant déjà mis est conservé."
    : "Modifie le nom ou le montant. Tu peux supprimer ou ajouter des lignes.";
  const body = `
    <p class="muted" style="margin: 0 0 14px;">${helpText}</p>
    <div id="modal-items">${rows}</div>
    <button class="btn-add-item" onclick="modalAddItem()">+ Ajouter une ligne</button>
    <label style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px; background: #2a2a2a; border-radius: 8px; cursor: pointer;">
      <input type="checkbox" id="list-apply-future" style="width: 18px; height: 18px; accent-color: #2383e2;" checked />
      <span style="font-size: 13px;">Appliquer aux mois futurs</span>
    </label>
  `;
  openModal(`Modifier ${label}`, body, { type: 'list', key });
}

function modalDelItem(i) {
  const row = document.querySelector(`#modal-items .modal-row[data-i="${i}"]`);
  if (row) row.remove();
}

function modalAddItem() {
  const container = document.getElementById('modal-items');
  const existingIndices = [...container.querySelectorAll('.modal-row')].map(r => parseInt(r.dataset.i));
  const newIdx = existingIndices.length ? Math.max(...existingIndices) + 1 : 0;
  const div = document.createElement('div');
  div.className = 'modal-row';
  div.dataset.i = 'new-' + newIdx;
  div.innerHTML = `
    <input type="text" placeholder="Nom" data-field="name" />
    <input type="number" placeholder="€" min="0" step="5" inputmode="numeric" data-field="amount" />
    <button class="del-item" onclick="this.parentElement.remove()" aria-label="Supprimer">✕</button>
  `;
  container.appendChild(div);
  div.querySelector('input[data-field="name"]').focus();
}

function saveModal() {
  if (!modalContext) return;
  const state = getState();
  if (modalContext.type === 'salary') {
    const newBudgets = {
      salary: Math.max(0, parseInt(document.getElementById('cfg-salary').value) || 0),
      aboBudget: Math.max(0, parseInt(document.getElementById('cfg-abo').value) || 0),
      essenceBudget: Math.max(0, parseInt(document.getElementById('cfg-essence').value) || 0),
      plaisirBudget: Math.max(0, parseInt(document.getElementById('cfg-plaisir').value) || 0),
      investBudget: Math.max(0, parseInt(document.getElementById('cfg-invest').value) || 0)
    };
    state.budgets = newBudgets;
    const applyFuture = document.getElementById('cfg-apply-future');
    if (applyFuture && applyFuture.checked) {
      config = Object.assign({}, config, newBudgets);
      saveConfig();
    }
    showToast('Budget mis à jour', 'purple');
  } else if (modalContext.type === 'plaisir') {
    const val = Math.max(0, parseInt(document.getElementById('cfg-plaisir').value) || 0);
    state.budgets.plaisirBudget = val;
    const applyFuture = document.getElementById('cfg-apply-future');
    if (applyFuture && applyFuture.checked) {
      config.plaisirBudget = val;
      saveConfig();
    }
    showToast('Budget plaisir mis à jour', 'purple');
  } else if (modalContext.type === 'list') {
    const rows = document.querySelectorAll('#modal-items .modal-row');
    const newItems = [];
    const isInvest = modalContext.key === 'invests';
    rows.forEach((row) => {
      const name = row.querySelector('input[data-field="name"]').value.trim();
      const amount = parseFloat(row.querySelector('input[data-field="amount"]').value) || 0;
      if (name && amount > 0) {
        const oldIdx = parseInt(row.dataset.i);
        const oldItem = !isNaN(oldIdx) && state[modalContext.key][oldIdx] ? state[modalContext.key][oldIdx] : null;
        if (isInvest) {
          // Pour les investissements : on garde le montant déjà mis (done)
          const oldDone = oldItem && typeof oldItem.done === 'number' ? oldItem.done : 0;
          newItems.push({ name, amount: Math.round(amount), done: oldDone });
        } else {
          // Pour les besoins essentiels : on garde l'état coché (paid)
          const wasPaid = oldItem ? oldItem.paid === true : false;
          newItems.push({ name, amount: Math.round(amount), paid: wasPaid });
        }
      }
    });
    state[modalContext.key] = newItems;
    // Appliquer aux mois futurs : on stocke un template dans la config
    const applyFuture = document.getElementById('list-apply-future');
    if (applyFuture && applyFuture.checked) {
      if (!config.defaultLists) config.defaultLists = {};
      // On stocke uniquement le nom et le montant cible (pas l'état coché/done)
      config.defaultLists[modalContext.key] = newItems.map(it => ({
        name: it.name,
        amount: it.amount
      }));
      saveConfig();
    }
    showToast('Liste mise à jour', 'purple');
  }
  saveAll();
  playSound('money');
  closeModal();
  renderAll();
}

function renderAll() {
  const state = getState();
  document.getElementById('month-display').textContent = getMonthLabel();
  renderList(state.abos, 'abo-list', 'abos');
  renderInvestList();
  renderPlaisirs();
  renderExtras();
  document.getElementById('essence-check').checked = state.essencePaid;
  document.getElementById('essence-amount').value = state.essenceAmount;
  updateEssenceVisual();
  document.getElementById('sound-toggle').textContent = soundOn ? '🔊' : '🔇';
  // renderChart est protégé : même s'il plante, les cases restent affichées
  try { renderChart(); } catch (e) { console.warn('Chart non disponible:', e); }
  saveAll();
}

applyCategoryColors();
renderAll();

// ============ VUE PLEIN ÉCRAN PLAISIRS ============
function openPlaisirFullView() {
  const state = getState();
  const backdrop = document.getElementById('fullview-backdrop');
  const statsEl = document.getElementById('fullview-stats');
  const content = document.getElementById('fullview-content');
  if (!backdrop || !content) return;

  // Grouper par type
  const byType = {};
  PLAISIR_TYPES.forEach(t => { byType[t.key] = []; });
  state.plaisirs.forEach((p, idx) => {
    const key = p.type || 'autre';
    if (!byType[key]) byType[key] = [];
    byType[key].push({ ...p, _idx: idx });
  });

  // Stats globales
  const total = state.plaisirs.reduce((s, p) => s + p.amount, 0);
  const plaisirExtras = state.extras.filter(e => e.target === 'Plaisir').reduce((s, e) => s + e.amount, 0);
  const budget = state.budgets.plaisirBudget + plaisirExtras;
  const avg = state.plaisirs.length ? Math.round(total / state.plaisirs.length) : 0;
  const topType = Object.entries(byType)
    .map(([k, arr]) => ({ key: k, sum: arr.reduce((s, p) => s + p.amount, 0) }))
    .sort((a, b) => b.sum - a.sum)[0];
  const topLabel = topType && topType.sum > 0 ? getPlaisirTypeMeta(topType.key).label : '—';

  statsEl.innerHTML = `
    <div class="fullview-stat-card"><div class="stat-label">Total dépensé</div><div class="stat-value">${total} €</div></div>
    <div class="fullview-stat-card"><div class="stat-label">Budget</div><div class="stat-value">${budget} €</div></div>
    <div class="fullview-stat-card"><div class="stat-label">Nb dépenses</div><div class="stat-value">${state.plaisirs.length}</div></div>
    <div class="fullview-stat-card"><div class="stat-label">Top catégorie</div><div class="stat-value" style="font-size: 15px;">${topLabel}</div></div>
  `;

  // Contenu par type
  content.innerHTML = '';
  PLAISIR_TYPES.forEach(t => {
    const items = byType[t.key];
    if (!items || items.length === 0) return;
    const sum = items.reduce((s, p) => s + p.amount, 0);
    const header = document.createElement('div');
    header.className = 'fullview-type-header';
    header.innerHTML = `<span>${escapeHtml(t.label)}</span><span>${sum} €  (${items.length})</span>`;
    content.appendChild(header);
    // Trier par date décroissante
    items.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    items.forEach(p => {
      const row = document.createElement('div');
      row.className = 'fullview-plaisir-row';
      row.innerHTML = `
        <div class="plaisir-info">
          <div class="plaisir-name-line">${escapeHtml(p.name)}</div>
          <div class="plaisir-date">${formatShortDate(p.date) || '—'}</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span class="amount">${p.amount} €</span>
          <button class="del" onclick="removePlaisirByIndex(${p._idx})" aria-label="Supprimer">✕</button>
        </div>
      `;
      content.appendChild(row);
    });
  });

  backdrop.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closePlaisirFullView() {
  const backdrop = document.getElementById('fullview-backdrop');
  if (backdrop) backdrop.classList.remove('show');
  document.body.style.overflow = '';
}

function removePlaisirByIndex(idx) {
  const state = getState();
  if (state.plaisirs[idx]) {
    state.plaisirs.splice(idx, 1);
    saveAll();
    playSound('delete');
    renderPlaisirs();
    renderChart();
    openPlaisirFullView(); // re-render la vue
  }
}

// ============ BASCULE GRAPHIQUE VUE GLOBALE / DÉTAILLÉE ============
let chartView = 'global'; // 'global' | 'detailed'

function toggleChartView() {
  chartView = (chartView === 'global') ? 'detailed' : 'global';
  const btn = document.getElementById('chart-toggle');
  if (btn) {
    btn.textContent = (chartView === 'global') ? '📊 Détail' : '🍩 Global';
    btn.classList.toggle('active', chartView === 'detailed');
  }
  // Détruire le chart pour forcer la recréation avec les nouvelles données
  if (typeof chart !== 'undefined' && chart) {
    try { chart.destroy(); } catch (e) {}
    chart = null;
  }
  renderChart();
}

document.addEventListener('touchstart', function unlock() {
  getAudioCtx();
}, { once: true });
</script>
